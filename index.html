<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bench Buddy</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="theme-color" content="#1C3A2E" />

    <!--
      Real-use feedback: first load on a phone was slow, and briefly showed
      a plain background before the app's own fonts/content appeared. Fixed
      by loading the app's own fonts (Baloo 2, Nunito) via a real <link>
      here instead of the `@import` SubRotationPlanner used to inject (which
      didn't exist until React had already mounted the signed-in app) — this
      starts the font fetch immediately, in parallel with the JS bundle.

      A later real PageSpeed trace (Slow 4G, Moto G Power) found this had
      grown to 7 preconnects, which Lighthouse itself flags as
      counterproductive past ~4: each one is a real DNS+TCP+TLS handshake
      competing for bandwidth/CPU with the actual critical resources during
      the exact window that matters most. Trimmed to the two pairs that
      trace actually measured as worth it: fonts (proven above) and
      reCAPTCHA Enterprise/App Check — that same trace found reCAPTCHA's own
      script is the single biggest thing this page loads (~690KB across two
      requests), and App Check runs unconditionally on every load, so
      warming that connection early is a real, measured win. Firestore/Auth/
      securetoken's own preconnects were dropped: those calls only fire
      *after* App Check itself resolves and the JS bundle has fully run, by
      which point a fresh handshake is cheap relative to everything already
      waited on — preconnecting to them this early mostly just idled out
      before use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap"
    />
    <!-- reCAPTCHA Enterprise (App Check) -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <!--
      Real-use feedback: on a first-ever visit (nothing cached yet), the
      screen was plain blank white until the whole JS bundle downloaded,
      parsed, and React mounted its own LoadingScreen — exactly the
      "did this actually load?" moment a stranger arriving from the
      marketing site would hit. #boot-splash below is pure HTML/CSS, no
      JS, so it paints the instant this document arrives, in the same
      colors/crest/spinner/wordmark as the real LoadingScreen.jsx it's
      standing in for — including the "Bench Buddy" wordmark added there so
      this brief wait reads as the app's own front door, not a generic
      spinner. It needs no removal logic of its own: main.jsx's
      ReactDOM.createRoot(...).render() replaces #root's entire contents
      on first render, so this is simply gone the moment React (or its
      own LoadingScreen) takes over — see that file's own comment.
    -->
    <style>
      @keyframes bb-boot-spin { to { transform: rotate(360deg); } }
      #boot-splash {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #F4F7F2; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-splash .ring-wrap { position: relative; width: 152px; height: 152px; display: flex; align-items: center; justify-content: center; }
      #boot-splash .ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 4px solid #DDE4E0; border-top-color: #1F4D36;
        animation: bb-boot-spin 0.9s linear infinite;
      }
      #boot-splash .crest {
        width: 132px; height: 132px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
      }
      #boot-splash .crest img { width: 100%; height: 100%; object-fit: cover; }
      #boot-splash .wordmark {
        font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: 22px; color: #1F4D36; margin-top: -4px;
      }
      #boot-splash .text { color: #1F4D36; font-weight: 700; font-size: 14px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring-wrap">
          <div class="ring"></div>
          <div class="crest"><img src="/icons/icon-512.png" alt="" /></div>
        </div>
        <div class="wordmark">Bench Buddy</div>
        <div class="text">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
