<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bench Buddy</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="theme-color" content="#1C3A2E" />

    <!--
      Real-use feedback: first load on a phone was slow, and briefly showed
      a plain background before the app's own fonts/content appeared. Two
      independent causes, fixed together here:

      1. The app's own fonts (Baloo 2, Nunito) were only ever loaded via an
         `@import` inside a <style> tag that SubRotationPlanner injects —
         which doesn't exist until React has already rendered the signed-in
         app (styles/tokens.js's `fontStyle`, still used there for the
         shared `* { box-sizing: border-box }` reset). Every screen that
         renders before that — the loading screen, sign-in — was stuck on
         the browser's fallback font, then visibly swapped mid-boot once
         SubRotationPlanner mounted and the font fetch could finally start.
         A real <link> here starts that fetch immediately, in parallel with
         the JS bundle, so fonts are ready before there's anything on
         screen that needs them.
      2. Firestore/Auth/App Check calls (firebaseClient.js) don't begin
         until the JS bundle has downloaded and run — so the DNS+TLS
         handshake to Google's servers hadn't even started yet at the point
         those calls are made. `preconnect` does that handshake in parallel
         with everything else, so by the time the app is ready to call
         Firestore, that round-trip is already warmed up.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap"
    />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <!-- reCAPTCHA Enterprise (App Check) -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
