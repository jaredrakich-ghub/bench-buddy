<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bench Buddy</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="theme-color" content="#1C3A2E" />

    <!--
      Real-use feedback: first load on a phone was slow, and briefly showed
      a plain background before the app's own fonts/content appeared. Two
      independent causes, fixed together here:

      1. The app's own fonts (Baloo 2, Nunito) were only ever loaded via an
         `@import` inside a <style> tag that SubRotationPlanner injects —
         which doesn't exist until React has already rendered the signed-in
         app (styles/tokens.js's `fontStyle`, still used there for the
         shared `* { box-sizing: border-box }` reset). Every screen that
         renders before that — the loading screen, sign-in — was stuck on
         the browser's fallback font, then visibly swapped mid-boot once
         SubRotationPlanner mounted and the font fetch could finally start.
         A real <link> here starts that fetch immediately, in parallel with
         the JS bundle, so fonts are ready before there's anything on
         screen that needs them.
      2. Firestore/Auth/App Check calls (firebaseClient.js) don't begin
         until the JS bundle has downloaded and run — so the DNS+TLS
         handshake to Google's servers hadn't even started yet at the point
         those calls are made. `preconnect` does that handshake in parallel
         with everything else, so by the time the app is ready to call
         Firestore, that round-trip is already warmed up.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap"
    />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />
    <!-- reCAPTCHA Enterprise (App Check) -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <!--
      Real-use feedback: on a first-ever visit (nothing cached yet), the
      screen was plain blank white until the whole JS bundle downloaded,
      parsed, and React mounted its own LoadingScreen — exactly the
      "did this actually load?" moment a stranger arriving from the
      marketing site would hit. #boot-splash below is pure HTML/CSS, no
      JS, so it paints the instant this document arrives, in the same
      colors/crest/spinner as the real LoadingScreen.jsx it's standing in
      for. It needs no removal logic of its own: main.jsx's
      ReactDOM.createRoot(...).render() replaces #root's entire contents
      on first render, so this is simply gone the moment React (or its
      own LoadingScreen) takes over — see that file's own comment.
    -->
    <style>
      @keyframes bb-boot-spin { to { transform: rotate(360deg); } }
      #boot-splash {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #F4F7F2; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-splash .ring-wrap { position: relative; width: 152px; height: 152px; display: flex; align-items: center; justify-content: center; }
      #boot-splash .ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 4px solid #DDE4E0; border-top-color: #1F4D36;
        animation: bb-boot-spin 0.9s linear infinite;
      }
      #boot-splash .crest {
        width: 132px; height: 132px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
      }
      #boot-splash .crest img { width: 100%; height: 100%; object-fit: cover; }
      #boot-splash .text { color: #1F4D36; font-weight: 700; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring-wrap">
          <div class="ring"></div>
          <div class="crest"><img src="/icons/icon-512.png" alt="" /></div>
        </div>
        <div class="text">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
