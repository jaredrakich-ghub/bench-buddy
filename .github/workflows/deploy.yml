name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you manually trigger a redeploy from the Actions tab without a new commit.
  workflow_dispatch:

# Only one deploy at a time; a new push cancels an in-flight one rather than
# queuing, since only the latest main ever needs to be live.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # firebase-tools (a devDependency, needed for local emulator testing)
          # pulls in transitive deps that require Node >=22 — using anything
          # older here produces a different dependency resolution than what
          # generated package-lock.json locally, which is exactly what broke
          # the first deploy run (`npm ci` reported the lock file "out of
          # sync" even though it wasn't, on a real machine).
          node-version: 22
          cache: npm
      # Needed for the Firestore emulator, which the emulator test suite
      # below spins up.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Emulator binaries are a one-time ~70MB download per firebase-tools
      # version — cache them so most runs skip it entirely instead of
      # re-downloading on every push.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Catches real mistakes (Rules of Hooks violations, undefined
      # variables, etc.) before spending time on the slower test/emulator
      # steps below — added after a live crash (React error #310) that a
      # linter would have caught the moment the code was written.
      - run: npm run lint
      - run: npm test
      # Runs the security-rules and firestoreTeams.js CRUD suite against the
      # local Firestore/Auth emulators (a "demo-" project — see .firebaserc —
      # so this never needs credentials or touches the real Firebase
      # project). Previously this only ever ran manually in a dev session;
      # wiring it in here means a rules or data-layer regression fails the
      # build instead of only being caught if someone happens to run it by
      # hand before shipping.
      - run: npm run test:emulator
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
