name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you manually trigger a redeploy from the Actions tab without a new commit.
  workflow_dispatch:

# Only one deploy at a time; a new push cancels an in-flight one rather than
# queuing, since only the latest main ever needs to be live.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # firebase-tools (a devDependency, needed for local emulator testing)
          # pulls in transitive deps that require Node >=22 — using anything
          # older here produces a different dependency resolution than what
          # generated package-lock.json locally, which is exactly what broke
          # the first deploy run (`npm ci` reported the lock file "out of
          # sync" even though it wasn't, on a real machine).
          node-version: 22
          cache: npm
      # Needed for the Firestore emulator, which the emulator test suite
      # below spins up.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Emulator binaries are a one-time ~70MB download per firebase-tools
      # version — cache them so most runs skip it entirely instead of
      # re-downloading on every push.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Catches real mistakes (Rules of Hooks violations, undefined
      # variables, etc.) before spending time on the slower test/emulator
      # steps below — added after a live crash (React error #310) that a
      # linter would have caught the moment the code was written.
      - run: npm run lint
      - run: npm test
      # Runs the security-rules and firestoreTeams.js CRUD suite against the
      # local Firestore/Auth emulators (a "demo-" project — see .firebaserc —
      # so this never needs credentials or touches the real Firebase
      # project). Previously this only ever ran manually in a dev session;
      # wiring it in here means a rules or data-layer regression fails the
      # build instead of only being caught if someone happens to run it by
      # hand before shipping.
      - run: npm run test:emulator
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Debt ledger, Later lane #2 — firestore.rules used to deploy only by
  # hand (see README's own "Deployment" section), a standing gap between
  # "the code that decided this write should be allowed" and "the rules
  # actually enforcing that in production," with nothing forcing the two
  # to stay in sync except memory. Runs on every push to main, same as
  # the app deploy above — a repeat deploy of unchanged rules is a cheap
  # no-op, and always-in-sync is simpler to reason about than only
  # deploying when firestore.rules itself changed.
  #
  # Authenticated via a service account key (Settings > Secrets and
  # variables > Actions > FIREBASE_SERVICE_ACCOUNT), scoped to the
  # minimal "Firebase Rules Admin" role — not the broader login:ci-style
  # personal token the manual command in the README still uses. Separate
  # job (not a step in `build` above) so a rules-deploy failure is
  # immediately obvious as its own red X in the Actions tab, not buried
  # inside the same job that also builds/tests the app.
  deploy-rules:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx firebase deploy --only firestore:rules --project bench-buddy-ada85
